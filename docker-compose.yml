# Stage 2 deployment on ONE host (Docker Compose): the whole system of plan §3.4.
# Default values come from .env; change them there or on the command line.
#
#   docker compose up -d --build                                  everything, one replica of each
#   docker compose up -d --scale search=3 --scale ingestion=3     more replicas
#   docker compose --profile monitoring up -d                     also the Management Center
#   docker compose up -d mongo hz-1 hz-2                          only the infrastructure, for
#                                                                 running the services from the IDE
#
# Who is reachable from the host: nginx (public API), from any machine of the network; only from
# this machine (127.0.0.1), the Control, the Management Center, and Hazelcast and MongoDB for the
# services run from the IDE and the tests: none of them has authentication. Ingestion, Indexing and
# Search are reached only inside the Docker network, by service name.
#
# Every container has fixed cpus and mem_limit: the assignment asks for known resources, and the
# benchmarks are only comparable that way.

x-hazelcast-member: &hazelcast-member
  image: hazelcast/hazelcast:${HAZELCAST_VERSION}
  cpus: ${HZ_CPUS}
  mem_limit: ${HZ_MEM_LIMIT}
  # Cluster configuration (CF-03): discovery, backups, the index of book-state, queue and topic
  # settings. Read-only: the members never write it.
  volumes:
    - ./hazelcast/hazelcast.yaml:/opt/hazelcast/config_ext/hazelcast.yaml:ro
  environment: &hazelcast-env
    HAZELCAST_CONFIG: /opt/hazelcast/config_ext/hazelcast.yaml
    # Hazelcast applies any HZ_* variable on top of the file. The cluster name comes from .env
    # so that members and services share one value.
    HZ_CLUSTERNAME: ${HZ_CLUSTER_NAME}
    JAVA_OPTS: "-Xms${HZ_HEAP} -Xmx${HZ_HEAP}"
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:5701/hazelcast/health/ready || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
  restart: unless-stopped

# What every Java service shares. No container_name: they must be able to scale.
x-java-service: &java-service
  restart: unless-stopped
  # PID 1 forwards SIGTERM, so "docker stop" runs the shutdown hooks of the service.
  init: true

# The variables of common/coordination (coordination contract §8).
x-hazelcast-client: &hazelcast-client
  HZ_MEMBERS: hz-1:5701,hz-2:5701
  HZ_CLUSTER_NAME: ${HZ_CLUSTER_NAME}
  LEASE_SECONDS: ${LEASE_SECONDS}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS}
  LEASE_CHECK_SECONDS: ${LEASE_CHECK_SECONDS}
  # The heap follows mem_limit, so changing the limit in .env is enough.
  JAVA_OPTS: "-XX:MaxRAMPercentage=${JAVA_HEAP_PERCENT}"

# MongoSettings: one database, in the Docker network.
x-mongo-client: &mongo-client
  MONGO_URI: ${MONGO_URI}
  MONGO_DATABASE: ${MONGO_DATABASE}
  MONGO_COLLECTION: ${MONGO_COLLECTION}

services:
  hz-1:
    <<: *hazelcast-member
    container_name: hz-1
    hostname: hz-1
    environment:
      <<: *hazelcast-env
      # Address this member announces to the cluster. Without it, the member picks 127.0.0.1
      # (because "hz-1" is in the TCP/IP member list) and the other member cannot reach it.
      HZ_NETWORK_PUBLICADDRESS: "hz-1:5701"
    ports:
      - "127.0.0.1:${HZ1_HOST_PORT}:5701"

  hz-2:
    <<: *hazelcast-member
    container_name: hz-2
    hostname: hz-2
    environment:
      <<: *hazelcast-env
      HZ_NETWORK_PUBLICADDRESS: "hz-2:5701"
    ports:
      - "127.0.0.1:${HZ2_HOST_PORT}:5701"

  mongo:
    image: mongo:${MONGO_VERSION}
    container_name: mongo
    hostname: mongo
    # mongod sizes its default cache from mem_limit (50% of limit - 1 GB, at least 256 MB), so it
    # would change whenever MONGO_MEM_LIMIT changes. The cache is fixed so benchmarks stay comparable.
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB}"]
    cpus: ${MONGO_CPUS}
    mem_limit: ${MONGO_MEM_LIMIT}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Only reachable from this machine (tests and services run from the IDE); the services in
    # Docker use mongodb://mongo:27017 through the internal network.
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT}:27017"
    restart: unless-stopped

  control:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: control-module }
    image: stage2/control-module
    cpus: ${CONTROL_CPUS}
    mem_limit: ${CONTROL_MEM_LIMIT}
    environment:
      <<: [*hazelcast-client, *mongo-client]
      CONTROL_PORT: 7000
      CONTROL_HTTP_THREADS: ${CONTROL_HTTP_THREADS}
      PUBLISH_BATCH: ${PUBLISH_BATCH}
      PUBLISH_INTERVAL_S: ${PUBLISH_INTERVAL_S}
      INDEXING_URL: http://indexing:7002
      DATA_DIR: /data
      # Optional list of books to seed once connected, e.g. /shared/book_ids.txt (.env).
      CONTROL_SEED_FILE: ${CONTROL_SEED_FILE:-}
    # Read-only: its recovery only looks at the <id>._READY markers (coordination contract §7).
    volumes:
      - ${DATALAKE_HOST_DIR}:/data/datalake:ro
      - ./shared:/shared:ro
    ports:
      - "127.0.0.1:${CONTROL_HOST_PORT}:7000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7000/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      hz-1: { condition: service_healthy }
      hz-2: { condition: service_healthy }
      mongo: { condition: service_healthy }

  ingestion:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: ingestion-service }
    image: stage2/ingestion-service
    cpus: ${INGESTION_CPUS}
    mem_limit: ${INGESTION_MEM_LIMIT}
    environment:
      <<: *hazelcast-client
      INGESTION_PORT: 7001
      INGESTION_HTTP_THREADS: ${INGESTION_HTTP_THREADS}
      INGESTION_WORKERS: ${INGESTION_WORKERS}
      INGESTION_FETCH_RETRIES: ${INGESTION_FETCH_RETRIES}
      INGESTION_SOURCE: ${INGESTION_SOURCE}
      INGESTION_LOCAL_DIR: /books
      DATA_DIR: /data
    volumes:
      # Read-write: the only service that writes the datalake.
      - ${DATALAKE_HOST_DIR}:/data/datalake
      # The pg<id>.txt files of INGESTION_SOURCE=local.
      - ${INGESTION_LOCAL_HOST_DIR}:/books:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7001/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      hz-1: { condition: service_healthy }
      hz-2: { condition: service_healthy }

  indexing:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: indexing-service }
    image: stage2/indexing-service
    cpus: ${INDEXING_CPUS}
    mem_limit: ${INDEXING_MEM_LIMIT}
    environment:
      <<: [*hazelcast-client, *mongo-client]
      INDEXING_PORT: 7002
      INDEXING_HTTP_THREADS: ${INDEXING_HTTP_THREADS}
      INDEXING_THREADS: ${INDEXING_THREADS}
      INDEX_WRITE_BATCH: ${INDEX_WRITE_BATCH}
      DATA_DIR: /data
    # Read-only: Indexing reads the books and writes only to MongoDB.
    volumes:
      - ${DATALAKE_HOST_DIR}:/data/datalake:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      hz-1: { condition: service_healthy }
      hz-2: { condition: service_healthy }
      mongo: { condition: service_healthy }

  search:
    <<: *java-service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { MODULE: search-service }
    image: stage2/search-service
    cpus: ${SEARCH_CPUS}
    mem_limit: ${SEARCH_MEM_LIMIT}
    # No volumes: the index and the metadata are in MongoDB.
    environment:
      <<: [*hazelcast-client, *mongo-client]
      SEARCH_PORT: 7003
      SEARCH_HTTP_THREADS: ${SEARCH_HTTP_THREADS}
      SEARCH_MONGO_POOL_SIZE: ${SEARCH_MONGO_POOL_SIZE}
      SEARCH_POLL_SECONDS: ${SEARCH_POLL_SECONDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7003/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Not on Hazelcast: Search connects in the background and works without it (periodic check).
    depends_on:
      mongo: { condition: service_healthy }

  # The public entry: round-robin over the replicas of "search" (scripts/nginx.conf).
  nginx:
    image: nginx:${NGINX_VERSION}
    cpus: ${NGINX_CPUS}
    mem_limit: ${NGINX_MEM_LIMIT}
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HOST_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      search: { condition: service_healthy }
    restart: unless-stopped

  # Optional, for the demo: docker compose --profile monitoring up -d
  management-center:
    image: hazelcast/management-center:${HAZELCAST_VERSION}
    profiles: ["monitoring"]
    cpus: ${MC_CPUS}
    mem_limit: ${MC_MEM_LIMIT}
    environment:
      MC_DEFAULT_CLUSTER: ${HZ_CLUSTER_NAME}
      MC_DEFAULT_CLUSTER_MEMBERS: hz-1:5701,hz-2:5701
    ports:
      - "127.0.0.1:${MC_HOST_PORT}:8080"
    depends_on:
      hz-1: { condition: service_healthy }
      hz-2: { condition: service_healthy }
    restart: unless-stopped

volumes:
  # Named volume, not a bind mount: avoids slow I/O and file-locking problems of Windows folders.
  # `docker compose down` keeps the data; `docker compose down -v` wipes it.
  mongo-data:

openapi: 3.0.3
info:
  title: Stage 2 Search Engine — Indexing Service API
  version: 0.6.0
  description: |
    Internal API of the **Indexing Service**, plus its operational status endpoint. None of
    these endpoints is public: nginx only exposes the Search Service, and the Indexing Service is
    reached inside the Docker network (`http://indexing:7002`).

    **Status: draft v0.6.0** (DR-05 and its review follow-up, DR-06b, DR-07, DR-08a, DR-08b and its review follow-up, plan v3.3).
    `POST /index/rebuild` answers 501 until DR-10; its contract is already the final one. Behaviour that arrives with a later task is marked **from DR-xx**. The
    inventory of all endpoints of the system is `api/endpoints.md`; the Search API is
    `api/openapi.yaml`.

    ## Role in the workflow
    In normal operation books are indexed through the Hazelcast `index-queue`, not through
    HTTP: the HTTP endpoints are for the Control Module (publication), for administration
    (single update, rebuild) and for the functional validation. Both paths run the same code.
    The queue is consumed by the **index writer** of the replica that holds the lock
    `index-writer` (coordination contract §5); the other replicas wait as standbys. It claims
    each book (`INDEXING`), indexes it and marks it `INDEXED` once it is in `index_log`; failures
    follow the codes of the contract (§4.3). The HTTP update does not change `book-state`.

    1. Ingestion writes `<id>._READY` and puts the id in `index-queue`.
    2. Indexing reads the book, saves its metadata (`books`) and its terms (`inverted_index`),
       and last records it in `index_log`: the book is **indexed**, but Search does not see it
       yet.
    3. The Control Module calls `POST /index/publish` every M books or T seconds: the indexed
       books become **published** in a new index version, and Search loads it.

    ## Common rules
    - All responses are JSON (`application/json; charset=utf-8`).
    - **Errors** always use the `Error` schema of the Search API, with a machine-readable `code`:
      `INVALID_PARAMETER` (400), `NOT_FOUND` (404), `REBUILD_IN_PROGRESS` (409, from DR-10),
      `EMPTY_BOOK` (422), `NOT_IMPLEMENTED` (501, temporary), `STORAGE_UNAVAILABLE` (503,
      MongoDB does not answer), `INTERNAL_ERROR` (500).
    - **Unknown routes.** A route that does not exist (or a method that a route does not
      have) answers 404 `NOT_FOUND` with the same `Error` schema and `field: null`, never
      the web framework's own page. All services share this rule (`ServiceServer` in `common`).
    - **Writes are serialized** inside the service: concurrent requests and the index writer
      are answered correctly, one write at a time. Across replicas, only the holder of
      `index-writer` consumes the queue; the writes of indexing are idempotent.
    - **Timeouts and retries (callers).** Connect timeout 2 s; request timeout 30 s for
      `update` and `publish`, 5 s for the status endpoints. Every `POST` is safe to retry after
      a timeout, a connection error or a 503 (see the idempotency notes of each one); use a
      growing delay between retries (1 s, 2 s, 4 s…).
  contact:
    name: Daniel Rodríguez (Indexing Service, index publication contract)

servers:
  - url: http://indexing:7002
    description: Inside the Docker network (Control Module)
  - url: http://localhost:7002
    description: One Indexing Service instance started directly (development, validation)

tags:
  - name: internal
    description: Consumed by the Control Module or by an operator; never by the front-end.
  - name: operational
    description: Health and status checks, consumed by Docker healthchecks and the Control Module.

paths:
  /index/update/{book_id}:
    post:
      tags: [internal]
      operationId: updateBook
      summary: Index one book of the datalake
      description: |
        **Provider:** Indexing Service. **Consumers:** operators and the functional validation
        (the Control Module assigns work through `index-queue`, not through this endpoint).

        Reads the book from the datalake, extracts its metadata into the collection `books`,
        adds its terms to the inverted index and, **last**, records the book in `index_log`:
        the evidence that the book is complete in the index, which the next publication reads.

        **Completion: synchronous.** A 200 means the book IS indexed (metadata, posting lists
        and `index_log` written in MongoDB). It does **not** mean that Search can find it: the
        book becomes visible with the next `POST /index/publish`. After a 503 part of the book
        may be written, but it is not in `index_log`: it is neither counted nor published until
        a retry completes it.

        **Idempotency.** Indexing the same book again changes nothing: metadata are replaced
        by `_id`, posting lists never repeat an id and `index_log` has one entry per book (only
        its time moves forward). Two concurrent calls for the same book both answer 200. After
        a timeout or a 503 the caller can simply call again.

        **Readiness.** Only complete books are indexed; a book that is missing or still being
        written gives 404. "Complete" means that the book has its `<id>._READY` marker in the
        datalake, which Ingestion writes after its header and body (contract §6.2). A datalake
        written before DR-06 has no markers: its books give 404 until they are ingested again.

        **Empty books.** A book whose body gives no term at all answers 422 `EMPTY_BOOK` and
        nothing is written: neither its metadata nor its terms. That happens when the body is
        empty, has only stopwords and punctuation, or is written only in characters the
        tokenizer does not keep (it keeps ASCII letters and digits, e.g. a book entirely in
        Greek or Chinese). Such a book could never be found by a search, so it must not be published.
        Calling again gives the same answer until the book changes in the datalake.
      parameters:
        - name: book_id
          in: path
          required: true
          description: |
            Project Gutenberg book id, written in canonical form: ASCII digits only, without
            sign or leading zeros (`84`, never `+84` or `0084`).
          schema:
            type: integer
            minimum: 1
            maximum: 999999999
          example: 1342
      responses:
        '200':
          description: The book is indexed (not yet published).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResponse'
              example:
                book_id: 1342
                index: updated
                terms: 6210
        '400':
          $ref: '#/components/responses/InvalidBookId'
        '404':
          description: The book is not complete in the datalake (no `<id>._READY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: NOT_FOUND, message: 'book 999999 is not ready in the datalake', field: book_id }
        '409':
          $ref: '#/components/responses/RebuildInProgress'
        '422':
          description: The book gives no term; nothing was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: EMPTY_BOOK, message: 'book 999 has no indexable terms', field: book_id }
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /index/publish:
    post:
      tags: [internal]
      operationId: publishIndex
      summary: Make the indexed books visible to Search as a new index version
      description: |
        **Provider:** Indexing Service. **Consumers:** Control Module (every `PUBLISH_BATCH`
        books or `PUBLISH_INTERVAL_S` seconds).

        Publishes version V+1 (`api/contracts/index-publication.md` §7): records the books of `index_log` that are not
        published yet in `index_books` with version V+1 (a book keeps the first version in which
        it became visible), then switches the `CURRENT` document of `index_meta` to V+1 in ONE
        atomic operation, and records the version in `index_publications`. The index itself is
        never copied. Right after answering, through Hazelcast (coordination contract §4.1 T10
        and §6), it announces the version with `IndexPublished` on the topic `index-events`
        (only when a new version was created, one event per version) and marks `PUBLISHED` in
        `book-state` every `INDEXED` book that is visible in `CURRENT`. That runs in a thread of
        its own, so a slow cluster never delays the answer; a caller that counts `INDEXED`
        books just after the 200 may still see the published ones for a few milliseconds.

        **Completion: synchronous.** A 200 means `CURRENT` already points to the returned
        version; each Search replica loads it as soon as it receives the event, or at its next
        check of `CURRENT`. Once `CURRENT` has switched the answer is 200 even if writing the
        `index_publications` entry fails: the next call (or the next start) writes it.

        **Without Hazelcast** (still connecting, or the cluster is down) the publication is
        made and answers 200 anyway: MongoDB is the truth. When the service connects or
        reconnects, it announces the last version it could not announce and marks the states
        (that also repairs a T10 interrupted by a crash, contract §7); a lost event is covered
        by the periodic check of Search.
        `GET /status` shows the state of the connection.

        **Idempotency.** If no book was indexed since the last publication, no empty version
        is created: the answer is 200 with the current version and `books_published: 0`. So a
        retry after a lost response returns the version that the first call created. If nothing
        has ever been published and there is nothing to publish, `version` and `published_at`
        are null.

        **Concurrency and failures.** Calls to one replica are serialized. `CURRENT` only moves
        from the version that was read (V) to V+1: a conditional update that is the fencing of
        coordination contract §5, so a late writer can never move it back. If another replica
        published first, the call starts again on the new version. A publication interrupted by
        a crash (books already in `index_books` with V+1, `CURRENT` still at V) is invisible to
        Search and is completed when the service starts again, or by the next call.
      responses:
        '200':
          description: The returned version is the published one (`CURRENT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
              examples:
                newVersion:
                  summary: 13 new books published as version 43
                  value:
                    version: 43
                    books_published: 13
                    total_books: 200
                    published_at: '2026-11-03T10:15:00Z'
                nothingNew:
                  summary: Nothing indexed since version 43, no new version
                  value:
                    version: 43
                    books_published: 0
                    total_books: 200
                    published_at: '2026-11-03T10:15:00Z'
                nothingYet:
                  summary: Nothing published ever and nothing indexed
                  value:
                    version: null
                    books_published: 0
                    total_books: 0
                    published_at: null
        '409':
          $ref: '#/components/responses/RebuildInProgress'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /index/rebuild:
    post:
      tags: [internal]
      operationId: rebuildIndex
      summary: Rebuild the whole index and metadata from the datalake (asynchronous)
      description: |
        **Provider:** Indexing Service. **Consumers:** operators (administration, after a
        change of tokenizer or stopwords, or to recover from a damaged index).

        Indexes every complete book of the datalake into a NEW collection
        (`inverted_index_rNN`). When it finishes, `CURRENT` switches to the new collection in
        ONE atomic operation, so searches keep working on the current index during the whole
        rebuild and never see a half-built one. The old collection is dropped after a margin.

        **Completion: asynchronous.** A rebuild of 100,000 books takes minutes, longer than an
        HTTP timeout, so the request is only **accepted** (202) and the work runs in the
        background. The caller observes progress, completion or failure in the `rebuild` field
        of `GET /index/status` (`state`: `running` → `done` | `failed`).

        **Duplicates and concurrency.** Only one rebuild runs at a time: a second call while
        one is running gets 409 and does not start another. While a rebuild runs,
        `POST /index/update` and `POST /index/publish` also answer 409 (retry later; this
        409 exists from DR-10, together with the rebuild). A
        failed rebuild leaves the current index untouched; calling again starts from scratch.

        **Until DR-10** this endpoint answers 501 `NOT_IMPLEMENTED`.
      responses:
        '202':
          description: The rebuild has started; follow it with `GET /index/status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildStatus'
              example:
                state: running
                started_at: '2026-11-03T10:20:00Z'
                finished_at: null
                processed: 0
                total: 200
                error: null
        '409':
          $ref: '#/components/responses/RebuildInProgress'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /index/status:
    get:
      tags: [internal]
      operationId: getIndexStatus
      summary: Statistics of the index and of the indexing process
      description: |
        **Provider:** Indexing Service. **Consumers:** Control Module (progress of a rebuild,
        monitoring), operators and the functional validation.

        Reads its numbers from MongoDB, so it answers 503 when MongoDB does not answer (unlike
        `GET /status`). Read-only: safe to call at any time.
      responses:
        '200':
          description: Current statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexStatus'
              examples:
                normal:
                  summary: 200 books indexed, 187 of them published
                  value:
                    books_indexed: 200
                    last_update: '2026-11-03T10:14:52Z'
                    index_size_MB: 42.7
                    published_version: 42
                    books_published: 187
                    rebuild: null
                rebuilding:
                  summary: A rebuild is running
                  value:
                    books_indexed: 200
                    last_update: '2026-11-03T10:14:52Z'
                    index_size_MB: 42.7
                    published_version: 43
                    books_published: 200
                    rebuild:
                      state: running
                      started_at: '2026-11-03T10:20:00Z'
                      finished_at: null
                      processed: 85
                      total: 200
                      error: null
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /status:
    get:
      tags: [operational]
      operationId: getStatus
      summary: Liveness of this Indexing process
      description: |
        **Provider:** Indexing Service. **Consumers:** Docker healthcheck, Control Module.

        Answers 200 while the process is running. It does NOT contact MongoDB on purpose: if
        MongoDB is down, restarting the Indexing Service would not fix it, so the healthcheck
        must not fail because of it, nor Hazelcast: `coordination` only reports the state of the
        connection, used to announce the publications and to consume `index-queue`. The state of the index is in
        `GET /index/status`.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
              example:
                service: indexing-service
                status: running
                coordination: connected
                coordination_failure: null
                writer:
                  role: active
                  indexed: 187
                  requeued: 2
                  failed: 1
                  lease_lost: 0
                  outage_pauses: 0
                  invalid_ids_dropped: 0
                  ids_skipped: 0

components:
  schemas:
    UpdateResponse:
      type: object
      required: [book_id, index, terms]
      properties:
        book_id: { type: integer, example: 1342 }
        index:
          type: string
          enum: [updated]
          description: Always `updated` on success (the book is indexed, not yet published).
        terms:
          type: integer
          minimum: 0
          description: Number of distinct terms of the book added to the inverted index.
          example: 6210

    PublishResponse:
      type: object
      required: [version, books_published, total_books, published_at]
      properties:
        version:
          type: integer
          minimum: 1
          nullable: true
          description: Version that `CURRENT` points to after the call (the same `index_version` that Search returns); null if nothing has ever been published.
          example: 43
        books_published:
          type: integer
          minimum: 0
          description: Books made visible by THIS call (0 if nothing new was indexed).
        total_books:
          type: integer
          minimum: 0
          description: Books visible in `version`.
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When `version` was published (UTC, to the second); null if nothing has ever been published.

    RebuildStatus:
      type: object
      # nullable here, and not next to the $ref in IndexStatus.rebuild: in OpenAPI 3.0 the
      # siblings of a $ref are ignored, and `nullable` next to `allOf` (without `type`) does
      # not let null through either. POST /index/rebuild never answers null.
      nullable: true
      description: |
        Progress of a rebuild. In `GET /index/status` it is null when no rebuild has been started
        since the process began.
      required: [state, started_at, finished_at, processed, total, error]
      properties:
        state:
          type: string
          enum: [running, done, failed]
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        processed:
          type: integer
          minimum: 0
          description: Books indexed so far into the new collection.
        total:
          type: integer
          minimum: 0
          description: Complete books found in the datalake when the rebuild started.
        error:
          type: string
          nullable: true
          description: Reason of the failure when `state` is `failed`.

    IndexStatus:
      type: object
      required: [books_indexed, last_update, index_size_MB, published_version, books_published, rebuild]
      properties:
        books_indexed:
          type: integer
          minimum: 0
          description: |
            Books complete in the index, published or not: the books of `index_log`. A book
            whose update failed halfway does not count. Kept in MongoDB, so it survives a
            restart of the service.
        last_update:
          type: string
          format: date-time
          nullable: true
          description: |
            When a book was last indexed (UTC, to the second), re-indexing included: the latest
            `indexed_at` of `index_log`; null if none yet. Kept in MongoDB, so it survives a
            restart of the service.
        index_size_MB:
          type: number
          minimum: 0
          description: |
            Size in MongoDB of the current inverted index collection, data plus indexes (MB).
            Approximate: MongoDB moves new data to the collection file at each checkpoint
            (about every 60 s), so right after indexing the value may still be lower than it
            will be. Exact sizes are measured by the benchmarks, not by this endpoint.
        published_version:
          type: integer
          nullable: true
          description: Version that `CURRENT` points to; null if nothing has been published yet.
        books_published:
          type: integer
          minimum: 0
          description: Books visible in `published_version`.
        rebuild:
          # Last rebuild started since the process began; null if none (see RebuildStatus).
          $ref: '#/components/schemas/RebuildStatus'

    ServiceStatus:
      type: object
      required: [service, status, coordination, coordination_failure, writer]
      properties:
        service: { type: string, example: indexing-service }
        status: { type: string, enum: [running] }
        coordination:
          type: string
          enum: [connecting, connected, disconnected, failed, closed]
          description: |
            Connection to Hazelcast, used to mark the published books, announce each version and
            consume `index-queue`. `connecting` until the cluster first answers (the service
            keeps working meanwhile); `disconnected` while the client reconnects by itself;
            `failed` if the connection could not even be attempted; `closed` while stopping.
        coordination_failure:
          type: string
          nullable: true
          description: |
            Why the connection `failed`, or what failed once connected (for example, starting
            the writer): then `coordination` may say `connected` while the writer is null. Null
            if nothing failed.
        writer:
          $ref: '#/components/schemas/WriterStatus'

    WriterStatus:
      type: object
      nullable: true
      description: |
        The consumer of `index-queue` of this replica, counting since the process started; null
        until the service has connected to Hazelcast once.
      required: [role, indexed, requeued, failed, lease_lost, outage_pauses, invalid_ids_dropped, ids_skipped]
      properties:
        role:
          type: string
          enum: [standby, active, stopped]
          description: |
            `active` while this replica holds the lock `index-writer` and consumes the queue;
            `standby` while another replica holds it (or the cluster is not connected).
        indexed: { type: integer, description: "Books indexed and marked INDEXED (T7)." }
        requeued: { type: integer, description: "Failed attempts sent back to the queue (T8)." }
        failed: { type: integer, description: "Books sent to FAILED (T9), permanent error or no attempts left." }
        lease_lost: { type: integer, description: "Books dropped because the Control had requeued them meanwhile." }
        outage_pauses: { type: integer, description: "Pauses because MongoDB did not answer (STORAGE_UNAVAILABLE, not counted as an attempt)." }
        invalid_ids_dropped: { type: integer, description: "Invalid ids taken from the queue and dropped; not 0 means someone offered a bad id (contract §2)." }
        ids_skipped: { type: integer, description: "Ids taken from the queue whose book was not DOWNLOADED (duplicates); harmless." }

    Error:
      type: object
      required: [error]
      description: Same schema as the Search API (`api/openapi.yaml`).
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_PARAMETER, NOT_FOUND, REBUILD_IN_PROGRESS, EMPTY_BOOK, NOT_IMPLEMENTED, STORAGE_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string, description: Human-readable explanation. }
            field:
              type: string
              nullable: true
              description: Parameter that caused the error, if any.

  responses:
    InvalidBookId:
      description: '`book_id` is not a positive integer in canonical form (1 to 999999999, digits only).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INVALID_PARAMETER, message: 'book_id must be a positive integer (1 to 999999999, digits only)', field: book_id }
    RebuildInProgress:
      description: A rebuild is running; retry when `GET /index/status` shows it finished. From DR-10 (until then it is never returned).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: REBUILD_IN_PROGRESS, message: 'a rebuild is running, retry later', field: null }
    NotImplemented:
      description: Temporary, until the task that implements the endpoint (DR-10 rebuild).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: NOT_IMPLEMENTED, message: 'POST /index/rebuild is not implemented yet (DR-10)', field: null }
    StorageUnavailable:
      description: MongoDB does not answer within the driver timeout; nothing was changed or the change is safe to repeat. Retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: STORAGE_UNAVAILABLE, message: 'the index storage (MongoDB) does not answer', field: null }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INTERNAL_ERROR, message: 'internal error', field: null }

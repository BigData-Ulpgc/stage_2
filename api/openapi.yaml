openapi: 3.0.3
info:
  title: Stage 2 Search Engine — Search Service API
  version: 0.2.0
  description: |
    Front-end-facing API of the search engine (provider: **Search Service**), plus its
    operational status endpoint.

    **Status: draft v0.2.0** (DP-01, updated to plan v3.1: index and metadata in MongoDB).
    Internal endpoints of Ingestion, Indexing and the Control Module are added by their owners
    in later versions; the full inventory of front-end, internal and operational endpoints is
    `api/endpoints.md`.

    ## Common rules
    - All responses are JSON (`application/json; charset=utf-8`).
    - **Consistency:** every response is computed from ONE published version of the index,
      returned as `index_version` (an integer, for example `42`). Each Search replica keeps an
      immutable snapshot of the published version: the version number from the `CURRENT`
      document of the MongoDB collection `index_meta`, the ids of the books published up to
      that version (`index_books`) and their metadata (`books`). A request takes the snapshot
      once when it starts, reads the posting lists of its terms from MongoDB and discards any
      book that is not in the snapshot, so it never sees a book that is indexed but not yet
      published, nor mixes two versions (contract §6.5 of the group plan). Filters are applied
      in memory on the snapshot metadata.
    - **Errors** always use the `Error` schema with a machine-readable `code`:
      `MISSING_PARAMETER`, `INVALID_PARAMETER` (400), `NOT_FOUND` (404),
      `INDEX_NOT_READY` (503, no index version has been published yet),
      `STORAGE_UNAVAILABLE` (503, MongoDB does not answer; retry later), `INTERNAL_ERROR` (500).
    - All endpoints are read-only (`GET`): they are safe and idempotent, and a client may
      retry them freely.
    - **CORS:** the allowed browser origins are configured with the `CORS_ORIGINS`
      environment variable of the Search Service.
  contact:
    name: Daniel Perdomo (Search Service, API contract)

servers:
  - url: http://localhost:8080
    description: nginx gateway in front of the Search replicas (Docker Compose deployment)
  - url: http://localhost:7003
    description: one Search Service instance started directly (development)

tags:
  - name: front-end
    description: Consumed by the search front-end (or an HTTP client exercising the same contract).
  - name: operational
    description: Health and status checks, consumed by Docker healthchecks and the Control Module.

paths:
  /search:
    get:
      tags: [front-end]
      operationId: searchBooks
      summary: Keyword search with optional author, language and year filters
      description: |
        **Provider:** Search Service. **Consumers:** front-end.

        **Matching.** `q` is tokenized with the same tokenizer used by the Indexing Service
        (ASCII letters and digits, lower-cased; tokens shorter than 2 characters and
        stopwords are removed). A book matches if its body contains **all** the terms
        (AND semantics).

        **Filters** are optional and are combined with AND:
        - `author`: case-insensitive *substring* match on the author field
          (`author=dickens` matches "Charles Dickens").
        - `language`: exact ISO 639-1 code in lower case, one of the 15 supported codes
          (`da`, `de`, `el`, `en`, `eo`, `es`, `fi`, `fr`, `it`, `la`, `nl`, `pt`, `ru`, `sv`,
          `zh`); any other value is a 400. A supported code that no book uses gives an empty
          result; `GET /search/filters` lists the codes present in the index. A book written in
          several languages ("English, French") has the code of the first one.
        - `year`: exact 4-digit year. The year of a book is the year of the "Original
          publication" line of its Gutenberg header when there is one, otherwise the year of
          its Gutenberg "Release date" (see `year_source` in `GET /books/{book_id}`). The
          release date is the date of the ebook, not of the work: in the 200 reference books
          only 9 have an "Original publication" line, so for about 95% of them `year` is the
          ebook year (Pride and Prejudice: 1998, not 1813).

        **Ordering and pagination.** Results are sorted by `book_id` ascending
        (deterministic). `total` is the number of matching books; `results` contains only
        the requested page (`offset`, `limit`). An `offset` beyond `total` returns an empty
        page with 200.

        A valid query with no matches returns **200** with `total: 0` and `results: []`.
      parameters:
        - name: q
          in: query
          required: true
          description: Search terms (at least one valid term after tokenization).
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: adventure
        - name: author
          in: query
          required: false
          description: Case-insensitive substring of the author name.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: twain
        - name: language
          in: query
          required: false
          description: ISO 639-1 language code, lower case, one of the supported codes.
          schema:
            type: string
            enum: [da, de, el, en, eo, es, fi, fr, it, la, nl, pt, ru, sv, zh]
          example: en
        - name: year
          in: query
          required: false
          description: Publication year (4 digits).
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 1998
        - name: offset
          in: query
          required: false
          description: Number of matching books to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of books returned in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Search executed (also when there are no matches).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                withFilter:
                  summary: Keyword search with a language filter
                  value:
                    query: adventure
                    filters: { language: en }
                    total: 25
                    offset: 0
                    limit: 20
                    index_version: 42
                    results:
                      - { book_id: 1342, title: Pride and Prejudice, author: Jane Austen, language: en, year: 1998 }
                      - { book_id: 67979, title: 'The Blue Castle: a novel', author: L. M. Montgomery, language: en, year: 1926 }
                noMatches:
                  summary: Valid query with no matches
                  value:
                    query: zzzzqqq
                    filters: {}
                    total: 0
                    offset: 0
                    limit: 20
                    index_version: 42
                    results: []
                secondPage:
                  summary: Combined filters and second page
                  value:
                    query: river
                    filters: { author: twain, language: en }
                    total: 2
                    offset: 1
                    limit: 1
                    index_version: 42
                    results:
                      - { book_id: 76, title: Adventures of Huckleberry Finn, author: Mark Twain, language: en, year: 2004 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{book_id}:
    get:
      tags: [front-end]
      operationId: getBook
      summary: Metadata of one book
      description: |
        **Provider:** Search Service. **Consumers:** front-end (book detail page).

        Only books contained in the published index version are visible; a book that has
        been ingested but not yet published returns 404.
      parameters:
        - name: book_id
          in: path
          required: true
          description: Project Gutenberg book id.
          schema:
            type: integer
            minimum: 0
          example: 1342
      responses:
        '200':
          description: The book exists in the published index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
              example:
                book_id: 1342
                title: Pride and Prejudice
                author: Jane Austen
                language: en
                year: 1998
                year_source: release_date
                release_date: June 1, 1998
                index_version: 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The book is not in the published index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: NOT_FOUND, message: 'book 999999 is not in the published index', field: book_id }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /search/filters:
    get:
      tags: [front-end]
      operationId: getSearchFilters
      summary: Filter values available in the published index
      description: |
        **Provider:** Search Service. **Consumers:** front-end (to fill the language selector
        and the year range).
      responses:
        '200':
          description: Available filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiltersResponse'
              example:
                books: 187
                languages:
                  - { code: en, books: 170 }
                  - { code: fr, books: 9 }
                  - { code: es, books: 8 }
                years: { min: 1991, max: 2026 }
                index_version: 42
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /status:
    get:
      tags: [operational]
      operationId: getStatus
      summary: Health and loaded index version of this Search instance
      description: |
        **Provider:** Search Service (each replica answers for itself).
        **Consumers:** Docker healthcheck, Control Module, operators.

        Returns 200 while the process is running, even if no index has been published yet
        (`index_version` is then `null`).
      responses:
        '200':
          description: The instance is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
              example:
                service: search-service
                status: running
                index_version: 42
                books_indexed: 187

components:
  schemas:
    BookSummary:
      type: object
      required: [book_id, title, author, language, year]
      properties:
        book_id: { type: integer, example: 1342 }
        title: { type: string, nullable: true, example: Pride and Prejudice }
        author:
          type: string
          nullable: true
          description: '"Author:" line of the header or, if there is none, "Creator:" ("Translator:" never counts).'
          example: Jane Austen
        language:
          type: string
          nullable: true
          description: ISO 639-1 code of the first language; null if it is not one of the supported languages.
          example: en
        year: { type: integer, nullable: true, example: 1998 }

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookSummary'
        - type: object
          required: [year_source, index_version]
          properties:
            year_source:
              type: string
              nullable: true
              enum: [original_publication, release_date, null]
              description: Where `year` comes from.
            release_date:
              type: string
              nullable: true
              description: Gutenberg release date as written in the header.
              example: June 1, 1998
            index_version: { type: integer, example: 42 }

    SearchResponse:
      type: object
      required: [query, filters, total, offset, limit, index_version, results]
      properties:
        query: { type: string, description: The q parameter as received. }
        filters:
          type: object
          description: Only the filters present in the request.
          properties:
            author: { type: string }
            language: { type: string }
            year: { type: integer }
        total: { type: integer, minimum: 0, description: Number of matching books (all pages). }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        index_version: { type: integer, description: Index version used for this response. }
        results:
          type: array
          description: The requested page, sorted by book_id ascending (at most `limit` items).
          items:
            $ref: '#/components/schemas/BookSummary'

    FiltersResponse:
      type: object
      required: [books, languages, years, index_version]
      properties:
        books: { type: integer, description: Books in the published index. }
        languages:
          type: array
          items:
            type: object
            required: [code, books]
            properties:
              code: { type: string, example: en }
              books: { type: integer, example: 170 }
        years:
          type: object
          required: [min, max]
          properties:
            min: { type: integer, nullable: true }
            max: { type: integer, nullable: true }
        index_version: { type: integer }

    ServiceStatus:
      type: object
      required: [service, status, index_version]
      properties:
        service: { type: string, example: search-service }
        status: { type: string, enum: [running] }
        index_version: { type: integer, nullable: true }
        books_indexed: { type: integer, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MISSING_PARAMETER, INVALID_PARAMETER, NOT_FOUND, INDEX_NOT_READY, STORAGE_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string, description: Human-readable explanation. }
            field:
              type: string
              nullable: true
              description: Parameter that caused the error, if any.

  responses:
    BadRequest:
      description: |
        Malformed or missing parameter. Cases: `q` missing (`MISSING_PARAMETER`); `q` with no
        valid term after tokenization, non-numeric or out-of-range `offset`/`limit`/`year`,
        `language` not in the supported codes, non-numeric `book_id` (`INVALID_PARAMETER`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missingQ:
              value:
                error: { code: MISSING_PARAMETER, message: 'q is required', field: q }
            badLimit:
              value:
                error: { code: INVALID_PARAMETER, message: 'limit must be an integer between 1 and 100', field: limit }
            onlyStopwords:
              value:
                error: { code: INVALID_PARAMETER, message: 'q has no searchable terms (only stopwords or 1-character words)', field: q }
            unsupportedLanguage:
              value:
                error: { code: INVALID_PARAMETER, message: 'language must be one of: da, de, el, en, eo, es, fi, fr, it, la, nl, pt, ru, sv, zh', field: language }
    ServiceUnavailable:
      description: |
        The request cannot be answered now; the client may retry later. Cases: no index version
        has been published yet (`INDEX_NOT_READY`), or MongoDB does not answer within the
        driver timeout (`STORAGE_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            indexNotReady:
              value:
                error: { code: INDEX_NOT_READY, message: 'no index version has been published yet', field: null }
            storageUnavailable:
              value:
                error: { code: STORAGE_UNAVAILABLE, message: 'the index storage (MongoDB) does not answer', field: null }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: INTERNAL_ERROR, message: 'internal error', field: null }

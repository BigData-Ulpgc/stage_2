# The public entry of the system: only the Search Service is behind it (plan §3.4).
# Round-robin over every replica of the service "search", found with the DNS of Docker, so
# "docker compose up -d --scale search=N" needs no change here.

worker_processes auto;

events {
    # Above the highest client concurrency of the load tests (256), counting both sides of
    # each proxied request.
    worker_connections 4096;
}

http {
    # The DNS server of Docker. A short validity: new replicas enter soon after they start.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream search_replicas {
        # "resolve" looks the name up again while running; it needs the shared zone. Without it,
        # nginx would keep the replicas it found when it started.
        zone search_replicas 256k;
        server search:7003 resolve;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://search_replicas;

            # Keep-alive to the replicas: without it, each request opens a new connection, and
            # the load tests would measure that instead of Search.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # The API is read-only, so a request to a replica that has just died can safely go
            # to another one. Short timeout: a dead replica must not stall the clients.
            # Not on http_503: a replica that answers is alive, and if MongoDB is down the others
            # would answer the same, after making the client wait and loading MongoDB three times.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;

            # Which replica answered: shows the round-robin in the demo and the validation.
            add_header X-Served-By $upstream_addr always;
        }
    }
}
